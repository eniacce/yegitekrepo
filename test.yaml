apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher-git-test
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rancher-git-test
  template:
    metadata:
      labels:
        app: rancher-git-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rancher-git-test
  namespace: default
spec:
  selector:
    app: rancher-git-test
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
